name: Tests

on:
  pull_request:
    branches: [main]
    # Docs-only changes don't affect test behavior — skip the suite.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - LICENSE
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PRs get the fastest browser as a quick gate; the full cross-browser
        # matrix runs on push to main, where the Allure report is published.
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium"]') || fromJSON('["chromium", "firefox", "webkit"]') }}
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Fail early with an actionable message instead of letting every
      # payment test fail cryptically when the app boots without keys.
      - name: Verify Stripe test keys are configured
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ] || [ -z "$STRIPE_PUBLISHABLE_KEY" ]; then
            echo "::error::STRIPE_SECRET_KEY and STRIPE_PUBLISHABLE_KEY repo secrets are required. Add them under Settings -> Secrets and variables -> Actions (use Stripe TEST-mode keys)."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build images (GHA layer cache)
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Run tests (${{ matrix.browser }})
        run: docker compose run --rm tests --browser=${{ matrix.browser }}

      - name: Dump app logs on failure
        if: failure()
        run: docker compose logs app

      - name: Shut down compose stack
        if: always()
        run: docker compose down -v

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.browser }}
          path: |
            test-results/
            test-logs/
          if-no-files-found: ignore
          retention-days: 14

  publish-report:
    name: Publish Allure report to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    needs: tests
    # Publish from main even when tests are red: failed runs in the trend
    # are more honest than a stale green report.
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Download Allure results from all browsers
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Fetch gh-pages history
        uses: actions/checkout@v6
        # First run: gh-pages does not exist yet — report generates without trends.
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate report with history
        uses: simple-elf/allure-report-action@e463a472d3b1d750f9544369d60589ff1964c820 # v1.14
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      # allure-report-action is a Docker action running as root: it copies the
      # gh-pages checkout (including .git) into allure-history as root-owned
      # files, which peaceiris can neither remove nor push over.
      - name: Drop stray .git dirs from publish assets
        run: sudo rm -rf allure-history/.git gh-pages/.git

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
