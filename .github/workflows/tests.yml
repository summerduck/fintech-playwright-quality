name: Tests

on:
  pull_request:
    branches: [main]
    # Docs-only changes don't affect test behavior — skip the suite.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - LICENSE
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PRs get the fastest browser as a quick gate; the full cross-browser
        # matrix runs on push to main, where the Allure report is published.
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium"]') || fromJSON('["chromium", "firefox", "webkit"]') }}
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Fail early with an actionable message instead of letting every
      # payment test fail cryptically when the app boots without keys.
      - name: Verify Stripe test keys are configured
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ] || [ -z "$STRIPE_PUBLISHABLE_KEY" ]; then
            echo "::error::STRIPE_SECRET_KEY and STRIPE_PUBLISHABLE_KEY repo secrets are required. Add them under Settings -> Secrets and variables -> Actions (use Stripe TEST-mode keys)."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build images (GHA layer cache)
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      # Retry policy: CI-only, browser-e2e-only, max 1 retry, and only for
      # infra-shaped failures — assertion failures never retry. The regex
      # covers Playwright TimeoutError (all browsers), Chromium net::ERR_*,
      # Firefox NS_ERROR_*, and WebKit's freeform "Could not connect".
      # GITHUB_STEP_SUMMARY inside the container points at a file under the
      # mounted test-logs/ volume; the step below bridges it to the runner's
      # real step summary (the runner-side file is not visible in-container).
      # GITHUB_RUN_ID/SHA/REF_NAME feed utils/run_record.py (flake history);
      # compose does not inherit runner env, so each var is bridged explicitly.
      - name: Run tests (${{ matrix.browser }})
        run: >-
          docker compose run --rm
          -e GITHUB_STEP_SUMMARY=/work/test-logs/flaky-summary.md
          -e GITHUB_RUN_ID -e GITHUB_SHA -e GITHUB_REF_NAME
          tests --browser=${{ matrix.browser }}
          --reruns=1 --only-rerun "TimeoutError|net::ERR|NS_ERROR_|Could not connect"

      - name: Publish flaky summary to run page
        if: always()
        run: |
          if [ -s test-logs/flaky-summary.md ]; then
            cat test-logs/flaky-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dump app logs on failure
        if: failure()
        run: docker compose logs app

      - name: Shut down compose stack
        if: always()
        run: docker compose down -v

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.browser }}
          path: |
            test-results/
            test-logs/
          if-no-files-found: ignore
          retention-days: 14

      # Dedicated tiny artifact: publish-report needs only this JSON, not the
      # hundreds of MB of traces that live in test-artifacts-<browser>.
      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-record-${{ matrix.browser }}
          path: test-logs/run-records/
          if-no-files-found: ignore
          retention-days: 14

  publish-report:
    name: Publish Allure report to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    needs: tests
    # Publish from main even when tests are red: failed runs in the trend
    # are more honest than a stale green report.
    if: always() && github.ref == 'refs/heads/main'

    steps:
      # The analyzer script must come from the tested ref; path: repo keeps
      # every existing relative path (allure-results, gh-pages) untouched.
      - name: Checkout repo (for the analyzer script)
        uses: actions/checkout@v6
        with:
          path: repo

      - name: Download Allure results from all browsers
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Download run records from all browsers
        uses: actions/download-artifact@v4
        with:
          pattern: run-record-*
          merge-multiple: true
          path: run-records

      - name: Fetch gh-pages history
        uses: actions/checkout@v6
        # First run: gh-pages does not exist yet — report generates without trends.
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate report with history
        uses: simple-elf/allure-report-action@e463a472d3b1d750f9544369d60589ff1964c820 # v1.14
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      # allure-report-action is a Docker action running as root: it copies the
      # gh-pages checkout (including .git) into allure-history as root-owned
      # files, which peaceiris can neither remove nor push over.
      - name: Drop stray .git dirs from publish assets
        run: sudo rm -rf allure-history/.git gh-pages/.git

      # The analyzer proposes; it never fails the build. allure-report-action
      # has already copied the previous gh-pages content (including last run's
      # flake-history/) into allure-history, so on analyzer failure the stale
      # copy survives instead of vanishing.
      - name: Analyze flake history
        continue-on-error: true
        run: |
          python3 repo/scripts/analyze_flake_history.py \
            --history-file gh-pages/flake-history/history.json \
            --run-records-dir run-records \
            --output-dir allure-history/flake-history \
            --repo "${{ github.repository }}" \
            --browsers chromium,firefox,webkit \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
