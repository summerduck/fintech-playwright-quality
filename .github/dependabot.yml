version: 2
updates:
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # The runner image tag must match the playwright pin in requirements.txt —
      # browsers are resolved by pip-package version. An image-only bump breaks
      # every browser launch, so this pair is bumped by hand, together.
      - dependency-name: mcr.microsoft.com/playwright/python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
